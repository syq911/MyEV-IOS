name: Build IPA

# 定制版打包流水线：产出「无签名 ipa」，供用户用 AltStore / Sideloadly 自行重签安装。
# 与 build.yml 的分工：build.yml 只做编译校验（不含打包），本文件负责产出可分发的产物。
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# 同一分支只保留最新一次构建，避免排队堆积
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # 镜像上可能有多个 Xcode，取最新的一个
      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          LATEST=${LATEST:-/Applications/Xcode.app}
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "ehviewer apple.xcodeproj" \
            -scheme "ehviewer apple"

      # 不做签名：ipa 的可安装性由安装时用用户自己的 Apple ID 重签来保证。
      # 版本号优先取 tag（v1.4.1 → 1.4.1），分支构建用默认值；这样 tag 与 ipa 内版本永不漂移。
      - name: Resolve marketing version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.4.1"
          fi
          echo "版本号: $VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project "ehviewer apple.xcodeproj" \
            -scheme "ehviewer apple" \
            -destination "generic/platform=iOS" \
            -archivePath build/EhViewer.xcarchive \
            MARKETING_VERSION=${{ steps.ver.outputs.value }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/EhViewer.xcarchive/Products/Applications/ehviewer apple.app"
          if [ ! -d "$APP" ]; then
            echo "::error::未找到 .app 产物，打印 archive 内容以便排查"
            find build/EhViewer.xcarchive -maxdepth 4 -name "*.app" -print
            exit 1
          fi
          echo "=== 产物信息 ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true
          echo "=== 内嵌扩展 ==="
          ls "$APP/PlugIns" 2>/dev/null || echo "(无 PlugIns)"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry EhViewer.ipa Payload
          ls -lh EhViewer.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EhViewer-ipa-${{ github.run_number }}
          path: build/EhViewer.ipa
          retention-days: 30

  # Phase 5：回归测试 gate。与打包 job 相互独立 —— 即便测试挂了，ipa 产物照样上传，
  # 便于「先能装、再修测试」，但 workflow 整体会标红提醒。
  test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          LATEST=${LATEST:-/Applications/Xcode.app}
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "ehviewer apple.xcodeproj" \
            -scheme "ehviewer apple"

      # 不写死机型：取当前镜像上最新 runtime 里可用的 iPhone 模拟器，避免机型改名 / 缺失导致误红。
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import sys, json
          devs = json.load(sys.stdin)['devices']
          pool = [d for rt in sorted(devs) for d in devs[rt] if 'iPhone' in d.get('name','')]
          print(pool[-1]['udid'] if pool else '')
          ")
          if [ -z "$UDID" ]; then
            echo "::error::镜像上没有可用的 iPhone 模拟器"
            xcrun simctl list devices available
            exit 1
          fi
          echo "挑中模拟器: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project "ehviewer apple.xcodeproj" \
            -scheme "ehviewer apple" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  # Phase 7：打 v* tag 时自动建 Release 并附上 ipa（用 runner 自带 gh + GITHUB_TOKEN，不需要 PAT）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "EhViewer-ipa-*"
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -lh dist
          gh release create "${GITHUB_REF_NAME}" dist/EhViewer.ipa \
            --title "EhViewer ${GITHUB_REF_NAME} (定制版)" \
            --notes "无签名 ipa，请用 AltStore / Sideloadly 自行重签安装。详见 CHANGELOG.md。"